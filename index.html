<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Nusa AI</title>
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{
  color-scheme:dark;--bg:#000;--panel:#0E0E11;--raise:#17171B;--ink:#EDEDF0;--muted:#868691;--line:transparent;
  --brand:#F2F2F5;--brand-ink:#0A0A0A;--accent:#F2F2F5;--user:#26262C;--user-ink:#F4F4F6;--bot:#0E0E11;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 "Source Sans 3",system-ui,sans-serif;overflow:hidden}
h1,h2,.brand{font-family:"Bricolage Grotesque","Source Sans 3",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
*:focus,*:focus-visible{outline:none}
.app{display:flex;height:100%}
/* sidebar */
.side{width:270px;background:var(--panel);display:flex;flex-direction:column;padding:14px;gap:10px;flex:none}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:20px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.new{border:0;background:var(--raise);border-radius:10px;padding:9px 12px;text-align:left;font-weight:600}
.new:hover{background:#202026}
.hist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.hist small{color:var(--muted);margin:8px 6px 2px}
.hist button{background:none;border:0;text-align:left;padding:8px 10px;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist button:hover,.hist button.on{background:var(--raise)}
.foot{display:flex;gap:8px;align-items:center;padding-top:10px;color:var(--muted);font-size:14px}
.foot .sp{flex:1}
.ic{background:var(--raise);border:0;border-radius:9px;width:36px;height:36px;display:grid;place-items:center}
/* main */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--panel)}
.top .t{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu{display:none}
select{background:var(--raise);color:var(--ink);border:0;border-radius:9px;padding:7px 8px;font:inherit}
.scroll{flex:1;overflow-y:auto;padding:18px 14px}
.col{max-width:720px;margin:0 auto}
.hero{padding:7vh 0 18px}
.hero h1{font-size:clamp(28px,6vw,42px);line-height:1.1;margin:0 0 8px;letter-spacing:-.02em}
.hero p{color:var(--muted);margin:0 0 20px;max-width:46ch}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.chip{background:var(--panel);border:0;border-radius:12px;padding:12px;text-align:left}
.chip:hover{background:var(--raise)}
.chip b{display:block;font-weight:600}
.chip span{color:var(--muted);font-size:14px}
.msg{display:flex;margin:12px 0}
.msg.u{justify-content:flex-end}
.bub{max-width:88%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
.u .bub{background:var(--user);color:var(--user-ink);border-bottom-right-radius:5px}
.b .bub{background:var(--bot);border:0;border-bottom-left-radius:5px}
.typing::after{content:none}
@keyframes caret{50%{opacity:0}}
.bub code{background:#000;border-radius:4px;padding:1px 5px;font-size:.92em}
.bub pre{background:#000;border-radius:8px;padding:10px;overflow-x:auto;margin:8px 0 0;font-size:14px}
.acts{display:flex;gap:6px;margin-top:6px}
.acts button{background:none;border:0;color:var(--muted);font-size:13px;padding:2px 4px}
/* loading atom 3D */
.think{display:inline-flex;align-items:center;gap:8px}
.atom{width:18px;height:18px;perspective:120px;display:block;flex:none}
.atom-in{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;animation:atomspin 3.2s linear infinite}
.ring{position:absolute;inset:0;display:block;border:1.2px solid #F2F2F5;border-radius:50%;transform-style:preserve-3d;box-shadow:none}
.ring:nth-child(1){transform:rotateZ(0deg) rotateX(72deg)}
.ring:nth-child(2){transform:rotateZ(60deg) rotateX(72deg)}
.ring:nth-child(3){transform:rotateZ(120deg) rotateX(72deg)}
.orb{position:absolute;inset:0;display:block;transform-style:preserve-3d;animation:orbit 1.6s linear infinite}
.ring:nth-child(2) .orb{animation-duration:2s;animation-direction:reverse}
.ring:nth-child(3) .orb{animation-duration:2.4s}
.orb i{position:absolute;left:50%;top:-2px;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:#fff;box-shadow:none}
.core{position:absolute;display:block;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:#fff;box-shadow:none;animation:pulse 1.4s ease-in-out infinite}
.think b{font-weight:400;font-size:14px;background:linear-gradient(90deg,#6b7280 0%,#F2F2F5 50%,#6b7280 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shine 1.8s linear infinite}
@keyframes shine{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes atomspin{from{transform:rotateX(18deg) rotateY(0)}to{transform:rotateX(18deg) rotateY(360deg)}}
@keyframes orbit{to{transform:rotateZ(360deg)}}
@keyframes pulse{50%{transform:scale(.7);opacity:.7}}
@media (prefers-reduced-motion:reduce){.atom-in,.orb,.core,.think b{animation-duration:8s}}
/* composer */
.comp{padding:8px 14px 12px;background:var(--bg)}
.box{max-width:720px;margin:0 auto;background:var(--panel);border:0;border-radius:20px;padding:8px}
.box:focus-within{background:var(--raise)}
textarea{width:100%;border:0;background:transparent;color:var(--ink);font:inherit;resize:none;max-height:140px;padding:6px 8px;outline:none}
.row{display:flex;gap:6px;align-items:center}

.row .mic{margin-left:auto;display:flex;align-items:center;justify-content:center;gap:6px}
.row .send{margin-left:0}
.mic.rec{background:#E5484D;color:#fff;width:auto;padding:0 12px}
.tm{font-size:13px}
.nav button{display:flex;align-items:center;gap:12px}
.nav svg{flex:none}
.pop .opt{display:flex;align-items:center;gap:12px;background:var(--raise);border-radius:16px;padding:14px;margin-top:10px;width:100%}
.opt b{flex:1;font-weight:600}
.sw{width:44px;height:26px;border-radius:13px;background:#33333B;position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.opt[aria-checked="true"] .sw{background:#fff}
.opt[aria-checked="true"] .sw::after{transform:translateX(18px);background:#0A0A0A}
.send{margin-left:auto;background:var(--accent);color:#0A0A0A;border:0;border-radius:12px;width:40px;height:36px;font-weight:700}
.send:disabled{opacity:.4;cursor:default}
.note{text-align:center;color:var(--muted);font-size:12px;margin-top:6px}
.scrim{display:none}
@media (max-width:760px){
  .side{position:fixed;z-index:5;inset:0 auto 0 0;transform:translateX(-100%);transition:transform .2s;padding-top:calc(14px + env(safe-area-inset-top,0px));width:82%;max-width:300px}
  .side.open{transform:none}
  .scrim.show{display:block;position:fixed;inset:0;background:rgba(10,12,30,.5);z-index:4}
  .menu{display:grid}
  .app{padding:0}
}
.box{position:relative}
.pop{display:none;position:absolute;left:0;right:0;bottom:calc(100% + 8px);background:var(--raise);border-radius:18px;padding:6px;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.pop.show{display:flex}
.pop button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:12px}
.pop button:hover{background:#202026}
.pop b{display:block;font-weight:600}
.pop span{color:var(--muted);font-size:14px}
.plus{font-size:22px;line-height:1;transition:transform .15s}
.plus[aria-expanded="true"]{transform:rotate(45deg)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:600}
.nav button.on{background:var(--raise);color:var(--ink)}
.login{width:100%;background:var(--accent);color:#0A0A0A;border:0;border-radius:12px;padding:11px;font-weight:700}
.login.in{background:var(--raise);color:var(--ink);font-weight:600}
.prof{display:flex;align-items:center;gap:11px;width:100%;background:var(--raise);border-radius:16px;padding:9px 10px 9px 9px}
.prof .av{width:40px;height:40px;border-radius:50%;flex:none;background:var(--accent);color:#0A0A0A;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;overflow:hidden;box-shadow:0 0 0 2px rgba(255,255,255,.12)}
.prof .av img{width:100%;height:100%;object-fit:cover;display:block}
.prof .pi{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.prof .pi b{color:var(--ink);font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prof .pi span{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prof .pout{flex:none;width:34px;height:34px;border:0;border-radius:10px;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center}
.prof .pout:active{background:#26262C;color:var(--ink)}
.modal{display:none;position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.72);align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.card{background:var(--panel);border-radius:20px;padding:22px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}
.card h2{margin:0}
.card p{margin:0 0 6px;color:var(--muted)}
.card input{background:var(--raise);border:0;border-radius:12px;padding:12px;color:var(--ink);font:inherit;outline:none}
.card input:focus{background:#202026}
.go{background:var(--accent);color:#0A0A0A;border:0;border-radius:12px;padding:12px;font-weight:700}
.alt{background:none;border:0;color:var(--muted);padding:6px}
.card small{color:var(--muted);text-align:center}
.files{display:none;flex:1;overflow-y:auto;padding:18px 14px}
body[data-view="project"] .files{display:block}
body[data-view="project"] .scroll,body[data-view="project"] .comp{display:none}
.files h2{margin:6vh 0 4px;font-size:28px}
.files p{color:var(--muted);margin:0 0 16px}
.drop{display:block;background:var(--panel);border-radius:16px;padding:28px;text-align:center;cursor:pointer;font-weight:600}
.drop:hover{background:var(--raise)}
.fi{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:14px;padding:10px 12px;margin-top:10px}
.fi .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fi small{color:var(--muted)}
.fi button{background:var(--raise);border:0;border-radius:9px;padding:6px 10px;font-size:14px}
*{-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation}
body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
textarea,input,.bub{-webkit-user-select:text;user-select:text}
.psc{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:8}
.psc.show{display:block}
.pop{position:fixed;left:0;right:0;bottom:0;border-radius:24px 24px 0 0;padding:10px 14px calc(18px + env(safe-area-inset-bottom,0px));z-index:9;max-height:82%;overflow-y:auto;box-shadow:none;background:var(--panel);transform:translateY(100%);display:flex;visibility:hidden;transition:transform .22s ease,visibility .22s}
.pop.show{transform:none;visibility:visible}
@media (prefers-reduced-motion:reduce){.pop{transition:none}}
.ph{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:14px}
.grab{display:block;width:36px;height:4px;border-radius:2px;background:#34343b}
.ph b{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:17px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pop .tile{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--raise);border-radius:16px;padding:16px 6px;text-align:center}
.tile i{width:46px;height:46px;border-radius:50%;background:#26262C;display:grid;place-items:center}
.sh{color:var(--muted);font-size:14px;margin:18px 4px 4px}
.atts{display:flex;gap:8px;overflow-x:auto;padding:4px 4px 0}
.atts:empty{display:none}
.at{position:relative;flex:none;background:var(--raise);border-radius:12px;padding:6px 30px 6px 6px;display:flex;align-items:center;gap:8px;max-width:210px}
.at img{width:38px;height:38px;object-fit:cover;border-radius:8px}
.at .an{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;padding-left:4px}
.at button{position:absolute;top:2px;right:2px;background:none;border:0;color:var(--muted);width:26px;height:26px;font-size:18px;line-height:1}
button:active{opacity:.65}
.top{position:relative}
.dd{display:none;position:absolute;right:10px;top:calc(100% + 4px);min-width:236px;background:var(--raise);border-radius:16px;padding:6px;flex-direction:column;z-index:7;box-shadow:0 14px 40px rgba(0,0,0,.7)}
.dd.show{display:flex}
.dd button{background:none;border:0;text-align:left;padding:12px 14px;border-radius:11px;font-size:16px}
.dd button:hover{background:#202026}
.dd .del{color:#FF6B6B}
.hist button.pin::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:middle}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);background:#2A2A31;color:var(--ink);padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;font-size:14px;max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.warn{position:fixed;left:50%;top:calc(24px + env(safe-area-inset-top,0px));transform:translateX(-50%) translateY(-12px);background:#3A1F22;color:#FFD9DB;border:1px solid #6B2B30;padding:11px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;z-index:30;font-size:14px;max-width:90%;text-align:center}
.warn.show{opacity:1;transform:translateX(-50%) translateY(0)}
.warn.ok{background:#12301F;color:#D3F7E0;border-color:#1F6B3B}
.go.danger{background:#E5484D;color:#fff}
.card{max-height:92%;overflow-y:auto}
.soc{display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:12px;padding:12px;font-weight:600}
.soc.g{background:#fff;color:#1B1B1F}
.soc.a{background:#26262C;color:#fff}
.orow{display:flex;gap:8px}.orow input{flex:1;min-width:0;letter-spacing:2px}.orow .soc{white-space:nowrap;padding:12px 14px}.orow .soc:disabled{opacity:.5}
.dd button{display:flex;align-items:center;gap:12px}
.dd svg{flex:none;color:var(--muted)}
.dd .del svg{color:#FF6B6B}
.intro{position:fixed;inset:0;z-index:100;background:#000;display:grid;place-items:center;overflow:hidden}
.intro::before{content:"";position:absolute;width:80vmin;height:80vmin;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.1),rgba(255,255,255,0) 65%);animation:iglow 2.6s ease-out both}
.intro.out{opacity:0;transform:scale(1.04);pointer-events:none;transition:opacity .6s ease,transform .6s ease}
.ib{position:relative;display:flex;flex-direction:column;align-items:center}
.lg{display:flex;align-items:center;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:clamp(44px,15vw,64px);color:#F2F2F5}
.lg .n{width:1.3em;height:1.3em;border-radius:.3em;background:#F2F2F5;color:#0A0A0A;display:grid;place-items:center;font-weight:700;font-size:1em;line-height:1;animation:ipop .65s cubic-bezier(.2,.9,.25,1.2) both}
.lg .w{display:flex;overflow:hidden;max-width:0;padding-left:.12em;animation:igrow .8s cubic-bezier(.2,.8,.2,1) .75s forwards}
.lg .w span{display:block;font-size:1.05em;font-weight:700;letter-spacing:-.02em;line-height:1.3;transform:translateY(105%);animation:iup .6s cubic-bezier(.2,.8,.2,1) forwards}
.lg .w span:nth-child(1){animation-delay:.85s}
.lg .w span:nth-child(2){animation-delay:.95s}
.lg .w span:nth-child(3){animation-delay:1.05s}
.tl{margin-top:26px;color:var(--muted);font-size:14px;letter-spacing:.03em;opacity:0;animation:ifade .7s ease 1.6s forwards}
@keyframes ipop{from{opacity:0;transform:scale(.55) rotate(-8deg)}to{opacity:1;transform:none}}
@keyframes igrow{from{max-width:0}to{max-width:2.6em}}
@keyframes iup{from{transform:translateY(105%)}to{transform:none}}
@keyframes ifade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes iglow{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.intro *,.intro::before{animation:none!important}.lg .w{max-width:3em}.lg .w span{transform:none}.tl{opacity:1}}
.scroll{display:flex;flex-direction:column}
#chat{display:flex;flex-direction:column;flex:1 0 auto;width:100%}
.hero{margin:auto 0;padding:0 8px 6vh;display:flex;flex-direction:column;align-items:center;text-align:center}
.hero p{margin:0;max-width:30ch}
.hl{width:60px;height:60px;border-radius:17px;background:#F2F2F5;color:#0A0A0A;display:grid;place-items:center;font:700 34px/1 "Bricolage Grotesque",system-ui,sans-serif;margin-bottom:20px}
</style>
</head>
<body>
<div class="intro" id="intro" aria-hidden="true"><div class="ib"><div class="lg"><div class="n">N</div><div class="w"><span>u</span><span>s</span><span>a</span></div></div><div class="tl">Tanya apa saja. Tulis. Kode.</div></div></div>
<script>
(function(){var el=document.getElementById('intro');
function end(){if(!el||!el.parentNode)return;el.classList.add('out');setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el)},700)}
var rm=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
var tl=el.querySelector('.tl');
if(tl&&!rm)tl.addEventListener('animationend',function(){setTimeout(end,800)});
setTimeout(end,rm?900:6000);})();
</script>
<div class="app">
  <aside class="side" id="side" aria-label="Riwayat obrolan">
    <div class="brand"><span class="logo" aria-hidden="true">N</span>Nusa</div>
    <nav class="nav" aria-label="Fitur"><button data-v="chat" class="on"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14v10H10l-4 4v-4H5z"/></svg>Chat</button><button data-v="project"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h6l2 2h8v10H4z"/></svg>Project</button></nav>
    <button class="new" id="new">+ Obrolan baru</button>
    <div class="hist" id="hist"><small>Hari ini</small></div>
    <div class="foot"><button class="login" id="loginb">Masuk atau daftar</button>
      <div class="prof" id="prof" style="display:none"><div class="av" id="pav"></div><div class="pi"><b id="pn"></b><span id="pm"></span></div><button class="pout" id="pout" type="button" aria-label="Keluar" title="Keluar"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></button></div></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="main">
    <header class="top">

<script>
const $=s=>document.querySelector(s);
const chat=$('#chat'),inp=$('#in'),send=$('#send'),sc=$('#scroll');
const starters=[
 ['Jelaskan konsep','Apa itu inflasi, pakai contoh harga bakso?'],
 ['Bantu menulis kode','Buat fungsi Python untuk validasi NIK'],
 ['Rangkum teks','Ringkas artikel yang saya tempel jadi 5 poin'],
 ['Rencanakan sesuatu','Susun jadwal belajar 4 minggu untuk UTBK']
];
let busy=false,n=0;
let cur=null,convs=[];
const LSK='nusa_convs_v1';
let sw=0;function saveConvs(){try{localStorage.setItem(LSK,JSON.stringify(convs.slice(0,60)))}catch(e){if(!sw++)toast('Penyimpanan browser mati, obrolan tidak bisa disimpan')}}
function loadConvs(){try{const a=JSON.parse(localStorage.getItem(LSK)||'[]');convs=Array.isArray(a)?a.filter(c=>c&&c.id&&typeof c.title==='string'&&Array.isArray(c.msgs)&&c.view==='chat'):[]}catch(e){convs=[]}}
function apiHist(c){const o=[];c.msgs.forEach((m,i)=>{if(m.err)return;const nx=c.msgs[i+1];if(m.r==='u'&&nx&&nx.err)return;o.push({role:m.r==='u'?'user':'assistant',content:m.t})});return o.slice(-20)}
const ACTS='<div class="acts"><button>Salin</button><button>Ulangi</button><button>Suka</button></div>';
function renderHist(){
  const h=$('#hist');h.innerHTML='<small>Hari ini</small>';curHist=null;
  [...convs].sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||(b.ts||0)-(a.ts||0)).forEach(c=>{
    const x=document.createElement('button');x.textContent=c.title;x.dataset.id=c.id;
    if(c.pin)x.classList.add('pin');
    if(cur&&cur.id===c.id){x.classList.add('on');curHist=x}
    h.appendChild(x);
  });
}
function openConv(id){
  const c=convs.find(x=>x.id===id);if(!c)return;
  cur=c;busy=false;n=c.msgs.filter(m=>m.r==='u').length;
  view=c.view;last=view;document.body.dataset.view=view;
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  $('#model').value='Nusa Cepat';
  inp.placeholder=MODES[view].ph;convTitle[view]=c.title;$('#title').textContent=c.title;
  chat.innerHTML='';
  c.msgs.forEach(m=>{
    if(typeof m.t!=='string')return;
    if(m.r==='u')add('u',m.t);
    else{const b=add('b',m.err?esc(m.t):renderReply(m.t));
      if(!m.err){b.insertAdjacentHTML('beforeend',ACTS);b.querySelector('.acts').firstChild.onclick=e=>{try{navigator.clipboard.writeText(m.t)}catch(_){};e.target.textContent='Tersalin'}}}
  });
  renderHist();renderPop();grow();close();sc.scrollTop=sc.scrollHeight;
}
const MODES={
 chat:{h:['Ngobrolin apa nih?','Gas, mau tanya apa?','Sini, lempar aja','Lagi ada ide apa?','Nusa udah standby, ayo'],p:'Nusa.ai',ph:'Tanya apa saja ke Nusa…',t:'Obrolan baru'}
};
let view='chat';
const convTitle={chat:'Obrolan baru'};
function hero(){
  const m=MODES[view];
  chat.innerHTML='<div class="hero"><div class="hl">N</div><h1></h1><p></p></div>';
  chat.querySelector('h1').textContent=Array.isArray(m.h)?m.h[Math.floor(Math.random()*m.h.length)]:m.h;chat.querySelector('p').textContent=m.p;
  inp.placeholder=m.ph;convTitle[view]=m.t;$('#title').textContent=m.t;curHist=null;cur=null;renderHist();
}
function add(role,text){
  const m=document.createElement('div');m.className='msg '+(role==='u'?'u':'b');
  const b=document.createElement('div');b.className='bub';
  if(role==='u')b.textContent=text;else b.innerHTML=text;
  m.appendChild(b);chat.appendChild(m);sc.scrollTop=sc.scrollHeight;return b;
}
function esc(t){return t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function ask(){
  const t0=inp.value.trim();if((!t0&&!att.length)||busy)return;const t=t0||('Lampiran: '+att.map(a=>a.n).join(', '));
  const shown=t0&&att.length?t+'\nLampiran: '+att.map(a=>a.n).join(', '):t;
  if(!cur){chat.innerHTML='';const ti=t.slice(0,40);convTitle[view]=ti;$('#title').textContent=ti;
    cur={id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),view:view,title:ti,msgs:[],pin:false,ts:Date.now()};convs.unshift(cur);renderHist()}
  const c=cur;c.msgs.push({r:'u',t:shown});c.ts=Date.now();saveConvs();
  n++;add('u',shown);att.length=0;renderAtt();inp.value='';grow();busy=true;send.disabled=true;
  const b=add('b','<span class="think"><span class="atom" aria-label="Memuat"><span class="atom-in"><span class="ring"><span class="orb"><i></i></span></span><span class="ring"><span class="orb"><i></i></span></span><span class="ring"><span class="orb"><i></i></span></span><span class="core"></span></span></span><b>Nusa started..</b></span>');
  const model=$('#model').value;
  const tg=webOn?['Pencarian web']:[];
  const acts='<div class="acts"><button>Salin</button><button>Ulangi</button><button>Suka</button></div>';
  const fin=copy=>{
    if(!b.querySelector('.acts'))b.insertAdjacentHTML('beforeend',acts);
    b.querySelector('.acts').firstChild.onclick=e=>{try{navigator.clipboard.writeText(copy)}catch(_){};e.target.textContent='Tersalin'};
    busy=false;send.disabled=!inp.value.trim();sc.scrollTop=sc.scrollHeight;
  };
  const done=(html,copy)=>{b.innerHTML=html;fin(copy)};
  
  if(!PROXY_URL){
    setTimeout(()=>done(('Mode demo: Nusa belum terhubung ke model. Pesanmu: <b>'+esc(t)+'</b>')+'<pre>model: '+esc(model)+'\nfitur aktif: '+(tg.join(', ')||'-')+'</pre>',t),900);
    return;
  }
  
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),30000);
  fetch(PROXY_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:model,mode:view,messages:apiHist(c)}),signal:ctl.signal})
    .then(r=>r.json().then(d=>{if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d}))
    .then(d=>{const a=(d.reply||'').trim()||'(jawaban kosong)';c.msgs.push({r:'b',t:a});c.ts=Date.now();saveConvs();typeReply(b,a,()=>fin(a))})
    .catch(e=>{const em='Maaf, Nusa gagal menjawab: '+(e.name==='AbortError'?'waktu habis':String(e.message));c.msgs.push({r:'b',t:em,err:true});saveConvs();done(esc(em),'')})
    .finally(()=>clearTimeout(to));
}
const PROXY_URL='https://nusa-worker.pinnshiki.workers.dev/'; // isi dengan URL Cloudflare Worker, contoh: https://nusa-proxy.namakamu.workers.dev
function typeReply(b,text,fin){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){b.innerHTML=renderReply(text);return fin()}
  const rate=Math.max(75,text.length/8); // karakter per detik; jawaban panjang dipercepat agar maks ~8 detik
  let t0=null,shown=-1;b.classList.add('typing');
  function step(ts){
    if(t0===null)t0=ts;
    const k=Math.min(text.length,Math.floor((ts-t0)/1000*rate));
    if(k!==shown){
      shown=k;b.innerHTML=renderReply(text.slice(0,k).replace(/`{1,2}$/,'').replace(/\*$/,''));
      if(sc.scrollHeight-sc.scrollTop-sc.clientHeight<140)sc.scrollTop=sc.scrollHeight;
    }
    if(k<text.length)requestAnimationFrame(step);
    else{b.classList.remove('typing');b.innerHTML=renderReply(text);fin()}
  }
  requestAnimationFrame(step);
}
function renderReply(x){return x.split('```').map((seg,k)=>k%2?'<pre>'+esc(seg.replace(/^\w*\n/,'').replace(/\n$/,''))+'</pre>':esc(seg).replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/`([^`\n]+)`/g,'<code>$1</code>')).join('')}
function addHist(t){
  const h=$('#hist');const x=document.createElement('button');x.textContent=t;
  h.querySelectorAll('button.on').forEach(e=>e.classList.remove('on'));x.className='on';const f=h.querySelector('button:not(.pin)');h.insertBefore(x,f);curHist=x;
}
function grow(){inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,140)+'px';send.disabled=busy||(!inp.value.trim()&&!att.length)}
inp.addEventListener('input',grow);
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}});
send.onclick=ask;

$('#new').onclick=()=>{if(view==='project')setView(last);n=0;hero();close()};
const side=$('#side'),scrim=$('#scrim');
function close(){side.classList.remove('open');scrim.classList.remove('show')}

$('#menu').onclick=()=>{if(Date.now()-openedAt<500)return;side.classList.add('open');scrim.classList.add('show');openedAt=Date.now()};
scrim.onclick=()=>{if(Date.now()-openedAt<500)return;close()};
const plus=$('#plus'),pop=$('#pop');
let last='chat';
document.body.dataset.view='chat';
function closePop(){pop.classList.remove('show');$('#psc').classList.remove('show');plus.setAttribute('aria-expanded','false')}
function renderPop(){
  const S=d=>'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+d+'</svg>';
  pop.innerHTML='<div class="ph"><span class="grab"></span><b>Tambahkan ke chat</b></div><div class="tiles">'+
    '<button class="tile" data-i="fcam"><i>'+S('<path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>')+'</i><div>Kamera</div></button>'+
    '<button class="tile" data-i="fpho"><i>'+S('<rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M5 17l5-5 4 4 2-2 3 3"/>')+'</i><div>Foto</div></button>'+
    '<button class="tile" data-i="ffil"><i>'+S('<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/><path d="M12 17v-5m-2 2l2-2 2 2"/>')+'</i><div>File</div></button></div>'+
    '<button class="opt" id="webopt" role="switch" aria-checked="'+webOn+'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg><b>Pencarian web</b><i class="sw"></i></button>'+
    '<div class="sh">Contoh pertanyaan</div>';
  pop.querySelectorAll('.tile').forEach(t=>t.onclick=()=>$('#'+t.dataset.i).click());
  $('#webopt').onclick=function(){webOn=!webOn;this.setAttribute('aria-checked',String(webOn))};
  starters.forEach(([a,b])=>{const x=document.createElement('button');x.innerHTML='<b></b><span></span>';x.firstChild.textContent=a;x.lastChild.textContent=b;x.onclick=()=>{closePop();inp.value=b;grow();ask()};pop.appendChild(x)});
}

  let t=60;b.disabled=true;b.textContent='Kirim ulang ('+t+')';
  clearInterval(otpTimer);otpTimer=setInterval(()=>{t--;if(t<=0){clearInterval(otpTimer);b.disabled=false;b.textContent='Kirim ulang'}else b.textContent='Kirim ulang ('+t+')'},1000)};
$('#lgo').onclick=async()=>{const e=$('#le').value.trim().toLowerCase(),p=$('#lp').value,g=$('#lgo');
  if(!/^\S+@\S+\.\S+$/.test(e)){warn('Isi email yang valid.');return}
  if(p.length<6){warn('Kata sandi minimal 6 karakter.');return}
  g.disabled=true;
  try{
    if(reg){
      if(!/@gmail\.com$/i.test(e)){warn('Pendaftaran memakai alamat Gmail (@gmail.com).');return}
      if(p!==$('#lp2').value){warn('Konfirmasi kata sandi tidak sama.');return}
      if(otpMail!==e){warn('Tekan "Kirim kode" dulu untuk dapat kode OTP.');return}
      const tok=$('#lo').value.trim();
      if(!/^\d{6}$/.test(tok)){warn('Masukkan 6 digit kode OTP dari email.');return}
      const v=await sb.auth.verifyOtp({email:e,token:tok,type:'email'});
      if(v.error){warn('Kode OTP salah atau kedaluwarsa.');return}
      const u=await sb.auth.updateUser({password:p});
      if(u.error){warn('Gagal menyimpan kata sandi: '+u.error.message,6000);return}
      otpMail=null;
      setUser(e.split('@')[0],{email:e});
    }else{
      const r=await sb.auth.signInWithPassword({email:e,password:p});
      if(r.error){warn('Email atau kata sandi salah.');return}
      setUser(e.split('@')[0],{email:e});
    }
  }catch(err){warn('Terjadi kesalahan jaringan. Coba lagi.')}
  finally{g.disabled=false}
};
/* project */
const pj=[];

  const l=$('#plist');l.innerHTML='';
  if(!pj.length){const p=document.createElement('p');p.style.marginTop='14px';p.textContent='Belum ada project. Buat yang pertama.';l.appendChild(p);return}
  pj.forEach((name,i)=>{
    const r=document.createElement('div');r.className='fi';
    r.innerHTML='<div class="nm"></div><button>Ganti nama</button><button>Hapus</button>';
    r.children[0].textContent=name;
    r.children[1].onclick=()=>dialog('Ganti nama project','',name,'Simpan',v=>{if(v){pj[i]=v;rp()}});
    r.children[2].onclick=()=>dialog('Hapus project?','Project dihapus dan tidak bisa dikembalikan.',null,'Hapus',()=>{pj.splice(i,1);rp();toast('Project dihapus')},true);
    l.appendChild(r);
  });
}
$('#pnew').onclick=()=>dialog('Project baru','Kelompokkan obrolan dan kode dalam satu project.','','Buat',v=>{if(v){pj.unshift(v);rp();toast('Project dibuat')}});
rp();
/* lampiran */
const att=[];
function renderAtt(){
  const a=$('#atts');a.innerHTML='';
  att.forEach((f,i)=>{const d=document.createElement('div');d.className='at';
    if(f.img){const im=document.createElement('img');im.src=f.img;im.alt='';d.appendChild(im)}
    const nm=document.createElement('div');nm.className='an';nm.textContent=f.n;d.appendChild(nm);
    const x=document.createElement('button');x.textContent='×';x.setAttribute('aria-label','Hapus lampiran');x.onclick=()=>{att.splice(i,1);renderAtt()};d.appendChild(x);a.appendChild(d)});
  grow();
}
function addAtt(files){
  [...files].forEach(f=>{const it={n:f.name||'foto.jpg',s:f.size,img:null};att.push(it);
    if(f.type.startsWith('image/')&&f.size<8388608){const r=new FileReader();r.onload=()=>{it.img=r.result;renderAtt()};r.readAsDataURL(f)}});
  renderAtt();
}
['fcam','fpho','ffil'].forEach(id=>{$('#'+id).onchange=e=>{addAtt(e.target.files);e.target.value='';closePop()}});
/* menu obrolan (titik 3) */
let curHist=null,tt,dp=null,dcb=null;
const dd=$('#dd'),more=$('#more'),dm=$('#dm'),histEl=$('#hist');
let wt;function warn(m,ms,ok){const w=$('#warn');w.textContent=m;w.classList.toggle('ok',!!ok);w.classList.add('show');clearTimeout(wt);wt=setTimeout(()=>w.classList.remove('show'),ms||2600)}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2400)}
function dialog(t,p,val,ok,cb,danger){
  $('#dt').textContent=t;const pe=$('#dp');pe.textContent=p;pe.style.display=p?'block':'none';
  const i=$('#di');i.style.display=val===null?'none':'block';i.value=val||'';
  const b=$('#dok');b.textContent=ok;b.classList.toggle('danger',!!danger);dcb=cb;dm.classList.add('show');if(val!==null)i.focus();
}
$('#dno').onclick=()=>dm.classList.remove('show');
$('#dok').onclick=()=>{const v=$('#di').value.trim();dm.classList.remove('show');if(dcb)dcb(v)};
function need(){if(curHist)return true;toast('Mulai obrolan dulu');return false}
async function shareChat(){
  const url=location.href,title='Nusa AI: '+convTitle[view];
  try{if(navigator.share){await navigator.share({title,url});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(url);toast('Tautan disalin')}catch(_){toast('Tautan tidak bisa disalin di sini')}
}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e});
function addHome(){if(dp){dp.prompt();dp=null;return}toast('Buka menu browser, lalu pilih Tambahkan ke layar utama')}
function act(a){
  if(a==='pin'){if(!need())return;cur.pin=!cur.pin;saveConvs();renderHist();toast(cur.pin?'Obrolan disematkan':'Sematan dilepas')}
  else if(a==='share'){if(need())shareChat()}
  else if(a==='rename'){if(!need())return;dialog('Ganti nama obrolan','',convTitle[view],'Simpan',v=>{if(!v)return;convTitle[view]=v;$('#title').textContent=v;cur.title=v;saveConvs();renderHist();toast('Nama diganti')})}
  else if(a==='home')addHome();
  else if(a==='del'){if(!need())return;dialog('Hapus obrolan ini?','Obrolan dihapus dari riwayat dan tidak bisa dikembalikan.',null,'Hapus',()=>{convs=convs.filter(x=>x!==cur);saveConvs();n=0;busy=false;hero();grow();toast('Obrolan dihapus')},true)}
}
more.onclick=e=>{e.stopPropagation();if(dd.classList.contains('show')){dd.classList.remove('show');return}
  dd.querySelector('[data-a="pin"] span').textContent=curHist&&curHist.classList.contains('pin')?'Lepas sematan':'Sematkan';dd.classList.add('show')};
document.addEventListener('click',()=>dd.classList.remove('show'));
dd.querySelectorAll('button').forEach(b=>b.onclick=()=>act(b.dataset.a));
/* pencarian web + voice note */
let webOn=false,rec=null,chunks=[],t0=0,tk=0;
const mic=$('#mic'),tmEl=$('#tm');
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
mic.onclick=async()=>{
  if(rec){rec.stop();return}
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true});
    rec=new MediaRecorder(st);chunks=[];t0=Date.now();
    rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=()=>{
      clearInterval(tk);st.getTracks().forEach(x=>x.stop());
      const sec=Math.round((Date.now()-t0)/1000),blob=new Blob(chunks,{type:rec.mimeType});
      rec=null;mic.classList.remove('rec');tmEl.textContent='';
      if(sec<1)return;
      att.push({n:'Voice note '+fmt(sec),s:blob.size,img:null,voice:true});renderAtt();
    };
    rec.start();mic.classList.add('rec');tmEl.textContent='0:00';
    tk=setInterval(()=>{tmEl.textContent=fmt(Math.round((Date.now()-t0)/1000))},500);
  }catch(_){toast('Mikrofon tidak bisa diakses. Izinkan akses mikrofon.')}
};
$('#hist').addEventListener('click',e=>{const b=e.target.closest('button[data-id]');if(b)openConv(b.dataset.id)});
addEventListener('pagehide',saveConvs);
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveConvs()});
try{localStorage.setItem('nusa_t','1');localStorage.removeItem('nusa_t')}catch(e){setTimeout(()=>toast('Penyimpanan browser mati, obrolan tidak bisa disimpan'),1500)}
try{['nusa_link','nusa_fs_v1'].forEach(k=>localStorage.removeItem(k))}catch(e){}
loadConvs();hero();renderPop();
